# Nachweis für das seitenweise Abholen: die 48 Kreise aus dem VG250-WFS des BKG
# in Seiten zu höchstens 10 Objekten (Standard sind 500 je Seite, dann reicht eine).
# Aufruf: docker compose run --rm pipeline --config /app/config/beispiel-paging.yaml --probelauf
berichte: /app/berichte
quellen:
  kreise_bkg:
    typ: wfs
    url: https://sgx.geodatenzentrum.de/wfs_vg250
    typename: vg250:vg250_krs
    id_feld: objid
    geometrie_feld: geom
    crs: urn:ogc:def:crs:EPSG::25833
    bbox: [250000, 5690000, 480000, 5940000]
    seitengroesse: 10
    felder: {ags: ags, gen: name, bez: art, lkz: land}
    lizenz: "© BKG (2026) dl-de/by-2-0"
